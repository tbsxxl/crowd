<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gründerzeit</title>
<script>if(/\/konzern$/.test(location.pathname))location.replace(location.pathname+"/"+location.search)</script>
<meta name="description" content="Rundenbasierte Wirtschaftssimulation: Vom Start-up zum Konzern">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: die Stadt als Diorama füllt den Bildschirm. Oben Kennzahlen und Zielkarte, unten ein Dock mit großem „Monat abschließen“.
   Alles Weitere öffnet sich in einem Seitenblatt (mobil: Bottom-Sheet). Ein helles Studio-Thema: Papier, Tinte, Serifen. */
:root{
  --bg:#ebe9e4;--bg-2:#f5f4f0;--ink:#24272b;--muted:#73746f;--line:rgba(36,39,43,.12);--card:rgba(250,249,246,.94);--soft:rgba(36,39,43,.05);
  --accent:#2f6fd0;--good:#2f8a55;--bad:#cc3b33;--warn:#c4761c;--gold:#d4a72c;
  --f-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;--f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:radial-gradient(110% 90% at 40% 40%,var(--bg-2) 0%,var(--bg) 60%,#e2dfd8 100%)}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 0 #fff inset,0 18px 44px -24px rgba(36,39,43,.45);border-radius:10px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--f-display)}
.pos{color:var(--good)}.neg{color:var(--bad)}
/* Kopf */
.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));pointer-events:none;z-index:2}
.brand h1{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-family:var(--f-display);font-size:15px;color:#4a4c4a}
.hud{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;padding:6px;gap:4px;z-index:3}
.hud .k{display:flex;flex-direction:column;justify-content:center;padding:4px 12px;border-radius:7px;min-width:0}
.hud .k+.k{border-left:1px solid var(--line);border-radius:0}
.hud .k b{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud .k span{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.topBtns{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:3}
@media (max-width:1500px) and (min-width:761px){.hud{left:220px;transform:none}.hud .k.opt2{display:none}}
.ib{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:58px;height:54px;border-radius:10px;font-size:20px;line-height:1}
.ib small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.ib:hover{background:#fff}
.badge{position:absolute;top:4px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.goalCard{position:fixed;top:calc(86px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;z-index:2;max-width:min(520px,calc(100vw - 32px));cursor:pointer;border:0}
.goalCard .gi{font-size:20px}.goalCard b{font-weight:700;font-size:13px}.goalCard span{font-size:12px;color:var(--muted)}
.goalCard .rw{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(212,167,44,.16);color:#7a5c10;padding:4px 8px;border-radius:6px;white-space:nowrap}
/* Dock */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;padding:6px;z-index:3}
.db{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:74px;height:58px;border-radius:9px;font-size:22px;line-height:1;position:relative}
.db small{font-size:11px;font-weight:700}
.db:hover,.db[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 1px var(--line)}
.endBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 20px 0 18px;border-radius:9px;background:var(--ink);color:#fff;position:relative}
.endBtn b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:22px;line-height:1}
.endBtn small{display:block;font-size:10.5px;opacity:.7;font-weight:600;letter-spacing:.04em;margin-top:2px}
.endBtn .arr{font-size:22px}
.endBtn:hover{background:#000}
.endBtn[data-wait="true"]{background:var(--warn)}
/* Blatt */
.sheet{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:440px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
.sh-head{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px 16px;border-bottom:1px solid var(--line)}
.sh-head .t{flex:1;min-width:0}
.sh-head h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:28px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;overflow-wrap:anywhere}
.x{all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.x:hover{background:var(--soft);color:var(--ink)}
.sh-body{flex:1;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.soft{background:rgba(255,255,255,.55)}
.ch{display:flex;align-items:center;gap:10px}
.ico{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.ch .t{flex:1;min-width:0}.ch .t b{display:block;font-weight:700;font-size:14px;line-height:1.25}.ch .t span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:112px}
.up:hover{border-color:rgba(36,39,43,.35)}
.up .e{font-size:24px;line-height:1}.up b{font-size:13px;font-weight:700;line-height:1.2}.up span{font-size:11.5px;color:var(--muted);line-height:1.35;flex:1}
.up .p{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink);background:var(--soft);border-radius:6px;padding:3px 7px;align-self:flex-start}
.up[data-on="true"]{border-color:var(--good);background:rgba(47,138,85,.06)}.up[data-on="true"] .p{background:var(--good);color:#fff}
.up[data-lock="true"]{opacity:.55;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>span:first-child{min-width:0}
.lbl{font-weight:700;font-size:13px}.sub{font-size:12px;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;flex:none}
.step button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;font-size:18px;font-weight:700}
.step button:hover{background:var(--soft)}
.step output{min-width:56px;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:500;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:38px;padding:0 6px;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:3px;border-radius:9px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 6px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(36,39,43,.15)}
.seg button:disabled{opacity:.35;cursor:default}
.tog{all:unset;cursor:pointer;width:46px;height:28px;border-radius:14px;background:rgba(36,39,43,.18);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--good)}.tog[aria-pressed="true"]::after{left:21px}
.btn{all:unset;cursor:pointer;text-align:center;font-size:13px;font-weight:700;padding:10px 14px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.btn:hover{border-color:rgba(36,39,43,.35)}
.btn.ink{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.ink:hover{background:#000}
.btn.bad{color:var(--bad)}
.btn[aria-disabled="true"]{opacity:.4;cursor:default}
.btn.wide{display:block}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ink)}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.cap{display:flex;flex-direction:column;gap:5px}
.stars{position:relative;display:inline-block;color:#d8d4cb;letter-spacing:1px;white-space:nowrap;line-height:1}
.stars i{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);font-style:normal;white-space:nowrap}
.quote{font-family:var(--f-display);font-style:italic;font-size:16px;line-height:1.35}
.hint{font-size:13px;line-height:1.45;background:rgba(47,111,208,.08);border-radius:9px;padding:10px 12px}
.warnbox{font-size:13px;line-height:1.45;background:rgba(196,118,28,.1);border-radius:9px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:6px}
.li{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.li:hover{border-color:rgba(36,39,43,.35)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:13.5px}.li .t span{display:block;font-size:12px;color:var(--muted)}
.li .v{text-align:right;font-family:var(--f-display);font-size:17px;white-space:nowrap}
.li .v small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(36,39,43,.18)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(36,39,43,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
input[type=text]{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 0;text-align:right;font-size:12.5px;white-space:nowrap}
th{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
td:first-child,th:first-child{text-align:left;white-space:normal}
tr.sum td{border-top:1px solid var(--ink);font-weight:800}
tr.dim td{color:var(--muted)}
canvas.chart{width:100%;height:150px;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Bau-Modus */
.placeBar{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;z-index:5;max-width:calc(100vw - 32px)}
.placeBar b{font-weight:700}
/* Monatsbericht */
.modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(36,39,43,.28);overflow:auto}
.report{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.report h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:40px;line-height:1;margin:2px 0 0}
.big{font-family:var(--f-display);font-weight:500;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.goalWin{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(212,167,44,.22),rgba(212,167,44,.08));border-radius:12px;padding:12px 14px;animation:pop .5s .3s both cubic-bezier(.2,1.4,.4,1)}
.goalWin .e{font-size:30px}
.evt{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.evt .e{font-size:18px;line-height:1.2}
/* Geld über den Gebäuden */
.floats{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.money{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-weight:500;font-size:19px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;animation:rise 3.2s ease-out forwards;box-shadow:0 6px 16px -8px rgba(36,39,43,.4)}
.money.p{color:var(--good)}.money.n{color:var(--bad)}
@keyframes rise{0%{opacity:0;margin-top:14px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
.tags{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.toast{position:fixed;left:50%;top:calc(132px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 16px;z-index:9;font-size:13.5px;font-weight:600;max-width:min(460px,calc(100vw - 32px));animation:pop .25s}
.toast.bad{border-left:3px solid var(--bad)}
/* Start */
.menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:radial-gradient(110% 90% at 45% 30%,rgba(245,244,240,.92),rgba(235,233,228,.97) 60%,rgba(226,223,216,.98));overflow:auto}
.menuCard{width:min(760px,100%);display:flex;flex-direction:column;gap:16px;padding:24px}
.menuCard h1{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(46px,8vw,80px);line-height:.9;margin:4px 0 0;letter-spacing:-.02em}
.lead{font-family:var(--f-display);font-size:18px;margin:0;color:#4a4c4a;max-width:54ch;line-height:1.4}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.65);padding:14px;display:flex;flex-direction:column;gap:6px}
.pick button[aria-pressed="true"]{background:#fff;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pick .e{font-size:28px}.pick b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:21px}.pick span{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){
  .brand{display:none}
  .hud{left:8px;right:8px;transform:none;top:calc(8px + env(safe-area-inset-top,0px));padding:4px;justify-content:space-between}
  .hud .k{padding:3px 7px}.hud .k b{font-size:16px}.hud .k span{font-size:8.5px;letter-spacing:.08em}.hud .k.opt{display:none}
  .topBtns{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:8px;flex-direction:column}
  .ib{width:46px;height:42px;font-size:17px}.ib small{font-size:8.5px}
  .goalCard{top:calc(62px + env(safe-area-inset-top,0px));left:8px;right:8px;transform:none;max-width:none}
  .dock{left:8px;right:8px;transform:none;bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:4px;padding:4px}
  .db{min-width:0;flex:1;height:54px;font-size:20px}.db small{font-size:10px}
  .endBtn{flex:2;padding:0 12px;gap:8px}.endBtn b{font-size:18px}.endBtn small{font-size:9.5px}
  .sheet{top:auto;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));width:auto;height:min(74%,calc(100% - 140px));border-radius:16px 16px 0 0}
  .sh-body{padding-bottom:20px}
  .placeBar{left:8px;right:8px;transform:none;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:none}
  .pick{grid-template-columns:1fr}
  .kpi b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="stage"><canvas id="gl" aria-label="Die Stadt als Diorama. Tippe auf ein Gebäude oder Grundstück."></canvas></div>
<div class="tags" id="tags"></div>
<div class="floats" id="floats"></div>
<header class="brand"><h1>Gründerzeit.</h1><p id="brandSub"></p></header>
<div class="hud panel" id="hud" hidden>
  <div class="k"><span>Monat</span><b id="hMonth">Januar 2027</b></div>
  <div class="k"><span>Kasse</span><b id="hCash">0 €</b></div>
  <div class="k"><span>Ergebnis Vormonat</span><b id="hNet">–</b></div>
  <div class="k opt"><span>Dein Vermögen</span><b id="hWealth">0 €</b></div>
  <div class="k opt opt2"><span>Team</span><b id="hStaff">1</b></div>
</div>
<div class="topBtns" id="topBtns" hidden>
  <button class="ib panel" data-a="open" data-v="wealth" aria-label="Vermögen">👤<small>Vermögen</small></button>
  <button class="ib panel" data-a="open" data-v="bank" aria-label="Börse">🏦<small>Börse</small></button>
  <button class="ib panel" data-a="open" data-v="fin" aria-label="Finanzen">📊<small>Finanzen</small></button>
  <button class="ib panel" data-a="open" data-v="group" aria-label="Konzern">🏛️<small>Konzern</small></button>
  <button class="ib panel" data-a="open" data-v="goals" aria-label="Ziele">🎯<small>Ziele</small></button>
  <button class="ib panel" data-a="open" data-v="menu" aria-label="Menü">☰<small>Menü</small></button>
</div>
<button class="goalCard panel" id="goalCard" data-a="open" data-v="goals" hidden></button>
<nav class="dock panel" id="dock" hidden>
  <button class="db" data-a="open" data-v="build" aria-label="Bauen">🏗️<small>Bauen</small></button>
  <button class="db" data-a="open" data-v="list" aria-label="Geschäfte">📋<small>Geschäfte</small></button>

</nav>

<div class="placeBar panel" id="placeBar" hidden></div>

<div class="modal" id="modal" hidden></div>
<div class="menu" id="menu"><div class="menuCard panel"><div class="eyebrow">Wirtschaftssimulation</div><h1>Gründerzeit.</h1><p class="lead" id="bootMsg">Lädt …</p><noscript><p class="lead">Bitte JavaScript aktivieren.</p></noscript></div></div>

<script>
window.addEventListener('error',function(e){var m=document.getElementById('bootMsg');var t='Fehler: '+(e.message||'Skript konnte nicht geladen werden')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'');
  if(m&&!document.getElementById('menu').hidden)m.textContent=t;else{var d=document.getElementById('toast');if(d){d.textContent=t;d.hidden=false}}},true);
</script>
<script src="../vendor/three-r128-bloom.js"></script>
<script src="sim.js"></script>
<script src="world.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),fe=K.fmtE,fn=K.fmtN,pct=v=>Math.round(v*100)+' %';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn=v=>(v>0?'+':'')+fe(v);
const SAVE='gz.save.v2';
const store={get(){try{const s=localStorage.getItem(SAVE);const g=s?JSON.parse(s):null;if(g){g.me=g.me||{cash:10000,salary:36000,stocks:{},lux:[],club:null};g.execs=g.execs||{};g.re=g.re||1;if(!g.stocks)K.genMarket(g)}return g}catch(e){return null}},set(v){try{localStorage.setItem(SAVE,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(SAVE)}catch(e){}}};
let G=null,view=null,place=null,newBranch='cafe',newFin='own',mobile=matchMedia('(max-width:760px)').matches;
const cur=()=>K.firm(G,G.cur)||G.firms[0];

// ---------- Start ----------
function showMenu(){const saved=store.get();const m=$('menu');m.hidden=false;
  m.innerHTML=`<div class="menuCard panel"><div><div class="eyebrow">Rundenbasierte Wirtschaftssimulation</div><h1>Gründerzeit.</h1></div>
  <p class="lead">Gründe ein kleines Start-up und mach daraus Monat für Monat einen Konzern mit tausenden Mitarbeitenden in mehreren Städten. Du planst in Ruhe, dann schließt du den Monat ab und siehst, was deine Entscheidungen gebracht haben.</p>
  ${saved?`<button class="btn ink" data-a="continue" style="padding:14px">Weiterspielen: ${esc(saved.firms[0].name)}, ${K.monthName(saved.month)}</button><div class="eyebrow">Oder neu beginnen</div>`:''}
  <div class="pick">${Object.entries(K.BRANCHES).map(([k,b])=>`<button data-a="pickBranch" data-k="${k}" aria-pressed="${k===newBranch}"><span class="e">${b.icon}</span><b>${b.long}</b><span>${b.desc}</span></button>`).join('')}</div>
  <div class="pick">
    <button data-a="pickFin" data-k="own" aria-pressed="${newFin==='own'}"><b>Eigenkapital</b><span>50.000 € aus eigener Tasche. Dir gehört alles.</span></button>
    <button data-a="pickFin" data-k="loan" aria-pressed="${newFin==='loan'}"><b>Bankkredit</b><span>Dazu ${newBranch==='prod'?'120.000':'60.000'} € zu 6,5 % über fünf Jahre.</span></button>
    <button data-a="pickFin" data-k="angel" aria-pressed="${newFin==='angel'}"><b>Business Angel</b><span>Dazu 150.000 € gegen 20 % deiner Anteile.</span></button></div>
  <div class="row"><input type="text" id="fname" maxlength="26" value="${esc({cafe:'Bohnenglück',soft:'Codewerk',prod:'Werkbank Nord'}[newBranch])}" aria-label="Name der Firma"><button class="btn ink" data-a="start" style="padding:13px 22px;white-space:nowrap">Firma gründen</button></div>
  <div class="sub">${newBranch==='prod'?'Tipp: Produktion braucht viel Kapital. Mit Kredit reicht es für Halle und erste Linie.':newBranch==='soft'?'Tipp: Apps verdienen erst nach dem Release. Ein Investor gibt dir Luft.':'Tipp: Ein Café trägt sich schnell, wenn Lage und Personal stimmen.'}</div></div>`}
function start(){const name=($('fname').value||'Mein Start-up').trim().slice(0,26);G=K.newGame({branch:newBranch,name,finance:newFin,seed:(Date.now()%1e9)|0});afterLoad();
  setTimeout(()=>open('build'),300)}
function afterLoad(){$('menu').hidden=true;['hud','topBtns','dock'].forEach(id=>$(id).hidden=false);World.setCity(G,G.cityCur);World.sync(G,true);refresh();save()}
function save(){if(G)store.set(G)}

// ---------- Kopf ----------
function refresh(){if(!G)return;const last=G.months[G.months.length-1];
  $('hMonth').textContent=K.monthName(G.month);const c=$('hCash');c.textContent=fe(G.cash);c.className=G.cash<0?'neg':'';
  const n=$('hNet');n.textContent=last?sgn(last.net):'–';n.className=last?(last.net>=0?'pos':'neg'):'';$('hStaff').textContent=fn(K.totalStaff(G));$('hWealth').textContent=fe(K.wealth(G).total);
  $('brandSub').textContent=cur().name+' · '+K.stage(G).n;
  $('endSub').textContent=G.pending.length?G.pending.length+(G.pending.length>1?' Entscheidungen offen':' Entscheidung offen'):K.MONTHS[G.month%12]+' abrechnen';$('endBtn').dataset.wait=G.pending.length>0;
  const g=K.GOALS.find(x=>!G.goals[x.k]);const gc=$('goalCard');
  if(g){gc.hidden=false;gc.innerHTML=`<span class="gi">🎯</span><span><b>${esc(g.n)}</b><br><span>Nächstes Ziel</span></span>${g.reward?`<span class="rw">+${fe(g.reward)}</span>`:''}`}else gc.hidden=true;
  World.sync(G);tags();if(view&&!$('sheet').hidden&&!busyInput())renderSheet()}
function busyInput(){const a=document.activeElement;return a&&a.tagName==='INPUT'&&$('sheet').contains(a)}

// ---------- Blatt ----------
const stack=[];
function open(v,p,keep){if(!keep)stack.length=0;else if(view)stack.push(view);view={v,p:p||{},tab:(p&&p.tab)||null};$('sheet').hidden=false;
  document.querySelectorAll('.db').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));renderSheet(true)}
function back(){view=stack.pop()||null;if(!view)return close();renderSheet(true)}
function close(){view=null;stack.length=0;$('sheet').hidden=true;document.querySelectorAll('.db').forEach(b=>b.setAttribute('aria-pressed',false));World.select(null);World.highlight(null)}
function renderSheet(top){const el=$('sheet');if(!view){el.hidden=true;return}const R=VIEWS[view.v];if(!R){close();return}const r=R(view.p);if(!r){close();return}
  const body=el.querySelector('.sh-body'),y=!top&&body?body.scrollTop:0;
  el.innerHTML=`<div class="sh-head">${stack.length?`<button class="x" data-a="back" aria-label="Zurück">←</button>`:''}<div class="t">${r.eyebrow?`<div class="eyebrow">${r.eyebrow}</div>`:''}<h2>${r.title}</h2>${r.sub?`<div class="sub" style="margin-top:3px">${r.sub}</div>`:''}</div><button class="x" data-a="close" aria-label="Schließen">×</button></div>
  ${r.tabs?`<div class="tabs" role="tablist">${r.tabs.map(([k,n])=>`<button class="tab" data-a="tab" data-v="${k}" aria-selected="${(view.tab||r.tabs[0][0])===k}">${n}</button>`).join('')}</div>`:''}<div class="sh-body">${r.body}</div>`;
  el.querySelector('.sh-body').scrollTop=y;const st=el.querySelector('.tab[aria-selected="true"]'),tb=el.querySelector('.tabs');if(st&&tb)tb.scrollLeft=Math.max(0,st.offsetLeft-tb.clientWidth+st.offsetWidth+16);if(r.after)r.after()}
const T=()=>view.tab;
// kleine Bausteine
const step=(a,val,attrs)=>`<span class="step"><button data-a="${a}" data-d="-1" ${attrs||''} aria-label="weniger">−</button><output>${val}</output><button data-a="${a}" data-d="1" ${attrs||''} aria-label="mehr">+</button></span>`;
const seg=(a,opts,cv,attrs)=>`<div class="seg">${opts.map(([v,l,sub,dis])=>`<button data-a="${a}" data-v="${v}" ${attrs||''} aria-pressed="${String(v)===String(cv)}" ${dis?'disabled':''}>${l}${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div>`;
const tog=(a,on,attrs)=>`<button class="tog" data-a="${a}" ${attrs||''} aria-pressed="${!!on}" aria-label="umschalten"></button>`;
const bar=(v,cls)=>`<div class="bar ${cls||''}"><i style="width:${Math.max(0,Math.min(100,v*100)).toFixed(1)}%"></i></div>`;
const starsH=s=>`<span class="stars" aria-label="${String(s).replace('.',',')} von 5 Sternen">★★★★★<i style="width:${Math.max(0,Math.min(5,s))/5*100}%">★★★★★</i></span>`;
const kpis=list=>`<div class="kpis">${list.map(([v,l,c])=>`<div class="kpi"><b class="${c||''}">${v}</b><span>${l}</span></div>`).join('')}</div>`;
const upCard=(a,attrs,e,n,d,price,on,lock)=>`<button class="up" data-a="${a}" ${attrs} data-on="${!!on}" data-lock="${!!lock}" ${lock?'aria-disabled="true"':''}><span class="e">${e}</span><b>${n}</b><span>${d}</span><span class="p">${on?'✓ vorhanden':lock?lock:price}</span></button>`;
const li=(attrs,ico,t,s,v,vs,cls)=>`<button class="li" ${attrs}><span class="ico">${ico}</span><span class="t"><b>${t}</b><span>${s}</span></span><span class="v ${cls||''}">${v}${vs?`<small>${vs}</small>`:''}</span></button>`;

const spark=(v,w,h,col)=>{if(!v||v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),X=i=>i*(w/(v.length-1)),Y=x=>h-2-(x-mn)/((mx-mn)||1)*(h-4);
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${col||'#24272b'}" stroke-width="2" points="${v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ')}"/></svg>`};
const donut=(parts,size)=>{const tot=parts.reduce((s,p)=>s+Math.max(0,p.v),0)||1,r=size/2-10,c=2*Math.PI*r;let off=0;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${size/2} ${size/2})">${parts.map(p=>{const l=Math.max(0,p.v)/tot*c;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}"/>`;off+=l;return el}).join('')}</g></svg>`};
const legend=parts=>`<div class="list" style="gap:4px;flex:1">${parts.map(p=>`<div class="row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.c};margin-right:6px"></i>${p.n}</span><b style="font-variant-numeric:tabular-nums">${p.t||fe(p.v)}</b></div>`).join('')}</div>`;
const VIEWS={};
// Bauen
VIEWS.build=()=>{let b='<div class="hint">Wähle, was du bauen willst. Danach leuchten passende Grundstücke in der Stadt grün auf.</div>';
  for(const f of G.firms){b+=`<div class="sec"><h3>${esc(f.name)} · ${K.BRANCHES[f.branch].n}</h3>`;
    if(f.branch==='cafe')b+=buildOpt('cafe',f,'☕','Neue Filiale','Café in Innenstadt, Wohnviertel oder Büroviertel. Einrichtung, Kaution und Anwerbung.','ab '+fe(15000+1700*2+1600));
    if(f.branch==='soft')b+=buildOpt('office',f,'🏢',f.office?'Größeres Büro':'Eigenes Büro','Mehr Arbeitsplätze für dein Team (Homeoffice: 3). Büroviertel oder Innenstadt.','ab '+fe(300*40+2600*2))+
      `<button class="li" data-a="open" data-v="office" data-id="${f.id}" data-keep="1"><span class="ico">✨</span><span class="t"><b>Neues App-Projekt</b><span>Genre und Umfang wählen, dein Team legt los.</span></span><span class="v">→</span></button>`;
    if(f.branch==='prod'){b+=buildOpt('factory',f,'🏭','Neue Halle','Fabrikhalle im Gewerbegebiet. Danach Produktionslinien kaufen.','Kaution ab '+fe(1500*3));
      for(const p of f.plants)b+=`<button class="li" data-a="open" data-v="plant" data-id="${p.id}" data-keep="1"><span class="ico">⚙️</span><span class="t"><b>Linie in ${K.cityName(K.plot(G,p.plot).city)} kaufen</b><span>${p.lines.length} von ${Math.floor(K.plot(G,p.plot).size/500)} Plätzen belegt</span></span><span class="v">→</span></button>`}
    b+='</div>'}
  b+=`<div class="sec"><h3>Konzern</h3>${G.hq?'':buildOpt('hq',null,'🏛️','Konzernzentrale','Ab 25 Mitarbeitenden. Danach Abteilungen wie Personal, Marketing, Controlling, Forschung.','250.000 €',K.totalStaff(G)<25?'ab 25 Mitarbeitenden':null)}
    <button class="li" data-a="open" data-v="group" data-tab="firms" data-keep="1"><span class="ico">➕</span><span class="t"><b>Neue Firma gründen</b><span>In eine weitere Branche einsteigen.</span></span><span class="v">→</span></button></div>`;
  return{eyebrow:K.monthName(G.month),title:'Bauen',body:b}};
function buildOpt(kind,f,ico,t,d,price,lock){return`<button class="li" data-a="place" data-k="${kind}" data-id="${f?f.id:''}" ${lock?'aria-disabled="true"':''}><span class="ico">${ico}</span><span class="t"><b>${t}</b><span>${d}</span></span><span class="v">${lock?`<small>${lock}</small>`:price}</span></button>`}
function eligible(kind){const use={cafe:'cafe',office:'office',factory:'factory',hq:'hq'}[kind];return G.plots.filter(p=>p.city===World.city&&!p.owner&&K.ZONES[p.zone].uses.includes(use)).map(p=>p.id)}
function startPlace(kind,fid){if(!G.cities[World.city]){toast('Diese Stadt ist noch nicht erschlossen.','bad');return}place={kind,fid};close();const ids=eligible(kind);World.highlight(ids);
  $('placeBar').hidden=false;$('placeBar').innerHTML=`<span>${{cafe:'☕',office:'🏢',factory:'🏭',hq:'🏛️'}[kind]} <b>${ids.length} passende Grundstücke</b> leuchten grün. Tippe eins an.</span><button class="btn" data-a="cancelPlace">Abbrechen</button>`;
  if(!ids.length)toast('Hier ist gerade nichts frei. Andere Stadt im Bereich Konzern erschließen.','bad')}
function endPlace(){place=null;$('placeBar').hidden=true;World.highlight(null)}
// Grundstück (frei, Konkurrenz)
VIEWS.plot=({id})=>{const p=K.plot(G,id);if(!p)return null;const z=K.ZONES[p.zone];let b=kpis([[fn(p.traffic),'Passanten am Tag'],[fe(p.rent),'Miete im Monat'],[fn(p.size)+' m²','Fläche']]);
  if(p.owner&&p.owner.startsWith('c:')){const cp=G.comps.find(c=>'c:'+c.id===p.owner);
    b+=`<div class="card"><div class="ch"><span class="ico">🏪</span><span class="t"><b>${esc(cp?cp.name:'Konkurrenz')}</b><span>${cp&&cp.branch==='cafe'?'Café-Kette · Qualität '+pct(cp.q)+' · Preise '+pct(cp.price):'Konkurrent'}</span></span></div>
      ${cp?`<button class="btn" data-a="open" data-v="group" data-tab="market" data-keep="1">Übernahme prüfen · ${fe(K.takeoverPrice(G,cp))}</button>`:''}</div>`;
    return{eyebrow:z.n+' · '+K.cityName(p.city),title:'Konkurrenz',body:b+propCard(p)}}
  if(p.owner){const uses={cafe:'Deine Filiale',office:'Dein Büro',factory:'Deine Fabrik',hq:'Konzernzentrale'};const ff=p.owner!=='H'&&K.firm(G,p.owner);
    return{eyebrow:z.n+' · '+K.cityName(p.city),title:uses[p.use]||'Dein Standort',sub:ff?esc(ff.name):'',body:b+(propCard(p)||'<div class="sub">Die Zentrale steht auf eigenem Grund.</div>')}}
  if(!G.cities[p.city])return{eyebrow:z.n,title:'Noch nicht erschlossen',body:b+'<div class="warnbox">Erschließe diese Stadt im Bereich Konzern.</div>'};
  let acts='';const kind=place?place.kind:null;
  for(const f of G.firms){if(f.branch==='cafe'&&z.uses.includes('cafe')&&(!kind||kind==='cafe')){const fc=K.forecastShop(G,f.id,p.id);
      acts+=`<div class="card"><div class="ch"><span class="ico">☕</span><span class="t"><b>Filiale von ${esc(f.name)}</b><span>Prognose bei ${fc.staff} Baristas</span></span></div>
      ${kpis([[fn(fc.guests),'Gäste im Monat'],[fe(fc.rev),'Umsatz'],[sgn(fc.profit),'Gewinn',fc.profit>=0?'pos':'neg']])}
      <button class="btn ink" data-a="build" data-k="cafe" data-id="${f.id}" data-p="${p.id}">Eröffnen · ${fe(K.shopCost(p))}</button></div>`}
    if(f.branch==='soft'&&z.uses.includes('office')&&(!kind||kind==='office'))acts+=`<div class="card"><div class="ch"><span class="ico">🏢</span><span class="t"><b>Büro für ${esc(f.name)}</b><span>${Math.floor(p.size/10)} Arbeitsplätze${f.office?', ersetzt das alte Büro':''}</span></span></div><button class="btn ink" data-a="build" data-k="office" data-id="${f.id}" data-p="${p.id}">Beziehen · ${fe(K.officeCost(p))}</button></div>`;
    if(f.branch==='prod'&&z.uses.includes('factory')&&(!kind||kind==='factory'))acts+=`<div class="card"><div class="ch"><span class="ico">🏭</span><span class="t"><b>Halle für ${esc(f.name)}</b><span>Platz für ${Math.floor(p.size/500)} Linien</span></span></div><button class="btn ink" data-a="build" data-k="factory" data-id="${f.id}" data-p="${p.id}">Mieten · ${fe(p.rent*3)} Kaution</button></div>`}
  if(z.uses.includes('hq')&&!G.hq&&(!kind||kind==='hq'))acts+=`<div class="card"><div class="ch"><span class="ico">🏛️</span><span class="t"><b>Konzernzentrale</b><span>${K.totalStaff(G)<25?'Erst ab 25 Mitarbeitenden':'Für Abteilungen und den Börsengang'}</span></span></div><button class="btn ${K.totalStaff(G)<25?'':'ink'}" data-a="build" data-k="hq" data-p="${p.id}" ${K.totalStaff(G)<25?'aria-disabled="true"':''}>Bauen · 250.000 €</button></div>`;
  if(!acts)acts=`<div class="sub">${p.zone==='gewerbe'?'Im Gewerbegebiet sind nur Fabriken erlaubt.':'Für deine Firmen ist hier nichts möglich.'}</div>`;
  return{eyebrow:z.n+' · '+K.cityName(p.city),title:p.prop==='H'?'Dein Gebäude':'Freies Grundstück',body:b+acts+propCard(p)}};
function propCard(p){const v=K.propValue(G,p);
  if(p.prop==='H'){const inc=K.propIncome(G,p),self=p.owner&&!p.owner.startsWith('c:');
    let h=`<div class="card"><div class="ch"><span class="ico">🏢</span><span class="t"><b>Immobilie im Besitz</b><span>Marktwert ${fe(v)}</span></span></div>`;
    if(self)h+=`<div class="sub">Du nutzt das Gebäude selbst und sparst ${fe(p.rent)} Miete im Monat (${(p.rent*12/v*100).toFixed(1).replace('.',',')} % Rendite).</div>`;
    else if(p.owner)h+=`<div class="sub">Vermietet an die Konkurrenz: ${fe(p.rent)} im Monat (${(p.rent*12/v*100).toFixed(1).replace('.',',')} % Rendite).</div>`;
    else h+=`<div class="row"><span><span class="lbl">Miete</span><br><span class="sub">${pct(p.leaseR||1)} vom Marktpreis · Auslastung ${pct(K.leaseOcc(p))}</span></span>${step('leaseR',fe(p.rent*(p.leaseR||1)),`data-id="${p.id}"`)}</div><div class="sub">Einnahmen ${fe(inc)} im Monat, ${(inc*12/v*100).toFixed(1).replace('.',',')} % Rendite. Höhere Miete senkt die Auslastung.</div>`;
    return h+(p.owner==='H'?'':`<button class="btn" data-a="sellProp" data-id="${p.id}">Verkaufen · ${fe(v*0.97)}</button>`)+'</div>'}
  if(p.owner==='H')return'';
  const self=p.owner&&!p.owner.startsWith('c:');return`<div class="card soft"><div class="ch"><span class="ico">🏢</span><span class="t"><b>Gebäude kaufen</b><span>${self?'Du sparst danach '+fe(p.rent)+' Miete im Monat.':p.owner?'Die Konkurrenz zahlt dir dann '+fe(p.rent)+' Miete im Monat.':'Vermiete es an Dritte oder nutze es später selbst.'} Rendite ${(K.YIELD[p.zone]*100).toFixed(1).replace('.',',')} %.</span></span></div><button class="btn" data-a="buyProp" data-id="${p.id}">Kaufen · ${fe(v*1.05)} inkl. Nebenkosten</button></div>`}
// Liste der Geschäfte
VIEWS.list=()=>{let b='';const last=G.report;
  for(const f of G.firms){b+=`<div class="sec"><h3>${esc(f.name)}</h3><div class="list">`;
    if(f.branch==='cafe'){for(const s of f.shops){const p=K.plot(G,s.plot),st=s.stat;b+=li(`data-a="open" data-v="shop" data-id="${s.id}" data-keep="1"`,'☕',K.ZONES[p.zone].n+', '+K.cityName(p.city),(st?fn(st.guests)+' Gäste · ':'neu · ')+starsH(K.stars(s.rep)),st?sgn(st.profit):'–','Gewinn',st?(st.profit>=0?'pos':'neg'):'')}

function drawChart(){const cv=$('chart1');if(!cv)return;const ms=G.months.slice(-24),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);

// ---------- Monatsabschluss ----------
function endTurn(){if(G.pending.length){open('decide');return}
  close();endPlace();const r=K.endTurn(G);if(!r)return;save();World.sync(G);refresh();floatMoney(r);setTimeout(()=>report(r),650);chime(r.net>=0)}
function floatMoney(r){const el=$('floats');el.innerHTML='';const byPlot={};
  for(const it of r.items){let pid=it.plot;if(it.kind==='app'||it.kind==='dev'){const f=K.firm(G,it.fid);pid=f&&f.office;if(!pid)continue}if(!pid)continue;byPlot[pid]=(byPlot[pid]||0)+it.profit}
  let k=0;for(const pid in byPlot){const p=K.plot(G,pid);if(p.city!==World.city)continue;const pr=World.project(pid,9);if(!pr||!pr.vis)continue;const v=byPlot[pid];
    const d=document.createElement('div');d.className='money '+(v>=0?'p':'n');d.textContent=sgn(v);d.style.left=pr.x+'px';d.style.top=pr.y+'px';d.style.animationDelay=(k++*0.12)+'s';el.appendChild(d)}
  setTimeout(()=>{el.innerHTML=''},4500)}
function report(r){const m=$('modal');m.hidden=false;const prev=G.months[G.months.length-2];
  const items=r.items.slice().sort((a,b)=>b.profit-a.profit);
  m.innerHTML=`<div class="report panel" role="dialog" aria-label="Monatsbericht"><div><div class="eyebrow">Monatsbericht</div><h2>${K.monthName(r.month)}</h2></div>
  <div><div class="big ${r.net>=0?'pos':'neg'}" id="bigNet">${sgn(0)}</div><div class="sub">Ergebnis nach Steuern${prev?' · Vormonat '+sgn(prev.net):''}</div></div>
  ${kpis([[fe(r.rev),'Umsatz'],[fe(r.cash),'Kasse',r.cash<0?'neg':''],[fe(K.wealth(G).total),'Dein Vermögen']])}
  ${r.goals.map(g=>`<div class="goalWin"><span class="e">🏆</span><span><b>Ziel erreicht: ${esc(g.n)}</b><br><span class="sub">${g.reward?'+'+fe(g.reward)+' Förderprämie':'Großartig!'}</span></span></div>`).join('')}
  ${items.length?`<div class="sec"><h3>Deine Geschäfte</h3><div class="list">${items.map(it=>`<div class="li" style="cursor:default"><span class="ico">${it.icon}</span><span class="t"><b>${esc(it.name)}</b><span>${esc(it.kpi)}${it.delta!=null&&it.delta!==0?` <b class="${it.delta>0?'pos':'neg'}">${it.delta>0?'▲':'▼'} ${fn(Math.abs(it.delta))}</b>`:''}${it.stars?' · '+starsH(it.stars):''}${it.broke?' · ⚠️ Ausfall':''}</span></span><span class="v ${it.profit>=0?'pos':'neg'}">${it.kind==='dev'?'':sgn(it.profit)}</span></div>`).join('')}</div></div>`:'<div class="hint">Noch keine Geschäfte. Öffne „Bauen“ und leg los!</div>'}
  ${r.events.length?`<div class="sec"><h3>Was passiert ist</h3>${r.events.map(e=>`<div class="evt"><span class="e">${e.icon}</span><span class="${e.bad?'neg':''}">${esc(e.t)}</span></div>`).join('')}</div>`:''}
  ${quotes()}
  ${G.pending.length?`<div class="warnbox">${G.pending.length>1?G.pending.length+' Entscheidungen warten':'Eine Entscheidung wartet'} auf dich.</div>`:''}
  <button class="btn ink wide" data-a="closeReport" style="padding:14px">${G.over?'Ergebnis ansehen':G.pending.length?'Zur Entscheidung':'Weiter planen'}</button></div>`;
  countUp($('bigNet'),r.net)}
function quotes(){const q=[];for(const f of G.firms){if(f.shops)for(const s of f.shops)for(const r of s.reviews||[])q.push(r);for(const a of G.apps.filter(a=>a.owner===f.id&&a.reviews))for(const r of a.reviews)q.push(r)}
  if(!q.length)return'';const pickQ=q.sort(()=>Math.random()-0.5).slice(0,2);return`<div class="sec"><h3>Neue Bewertungen</h3>${pickQ.map(r=>`<div>${starsH(r.s)}<div class="quote">${esc(r.t)}</div></div>`).join('')}</div>`}
function countUp(el,v){if(!el)return;const t0=performance.now(),d=900;const tick=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=sgn(v*e);if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
let actx=null;function chime(good){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;
  (good?[660,880,1320]:[440,330]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,now+i*0.09);g.gain.linearRampToValueAtTime(0.06,now+i*0.09+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.09+0.4);o.connect(g).connect(actx.destination);o.start(now+i*0.09);o.stop(now+i*0.09+0.45)})}catch(e){}}
function gameOver(){const v=K.valuation(G);const m=$('modal');m.hidden=false;m.innerHTML=`<div class="report panel"><div class="eyebrow">Insolvenz</div><h2>Das war's.</h2><p class="lead">${esc(G.firms[0].name)} ist im ${K.monthName(G.month)} zahlungsunfähig. Erreicht: ${Object.keys(G.goals).length} von ${K.GOALS.length} Zielen.</p><button class="btn ink wide" data-a="restart">Neues Spiel</button></div>`}

// ---------- Aktionen ----------
function run(res,quiet){if(!res)return res;if(res.msg&&(!quiet||!res.ok))toast(res.msg,res.ok?'':'bad');refresh();return res}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.getAttribute('aria-disabled')==='true'||b.disabled)return;
  const a=b.dataset.a,d=+b.dataset.d||0,id=b.dataset.id,k=b.dataset.k,v=b.dataset.v;const f=G&&cur();
  switch(a){
  case'pickBranch':newBranch=k;if(k==='prod'&&newFin==='own')newFin='loan';showMenu();break;
  case'pickFin':newFin=k;showMenu();break;
  case'start':start();break;
  case'continue':G=store.get();afterLoad();break;
  case'open':{const keep=b.dataset.keep==='1'&&view;open(v,{id:id&&isNaN(+id)?id:id!==undefined?+id||id:undefined,tab:b.dataset.tab},keep);if(b.dataset.tab){view.tab=b.dataset.tab;renderSheet(true)}break}
  case'tab':if(view){view.tab=v;renderSheet(true)}break;
  case'back':back();break;case'close':close();break;
  case'place':startPlace(k,id);break;case'cancelPlace':endPlace();break;
  case'build':{let r;if(k==='cafe')r=K.act.openShop(G,id,b.dataset.p);if(k==='office')r=K.act.rentOffice(G,id,b.dataset.p);if(k==='factory')r=K.act.rentPlant(G,id,b.dataset.p);if(k==='hq')r=K.act.buildHQ(G,b.dataset.p);
    run(r);if(r&&r.ok){endPlace();if(k==='cafe')open('shop',{id:r.id});else if(k==='factory')open('plant',{id:r.id});else if(k==='office')open('office',{id});else close();save()}break}
  case'shopStaff':{const [,s]=K.shopOf(G,+id);run(K.act.shop(G,+id,{staff:s.staff+d}),1);break}
  case'shopMgr':{const [,s]=K.shopOf(G,+id);run(K.act.shop(G,+id,{manager:!s.manager}),1);break}
  case'shopHours':run(K.act.shop(G,+id,{hours:v}),1);break;
  case'shopTrain':run(K.act.shop(G,+id,{train:true}));break;
  case'shopLevel':run(K.act.shop(G,+id,{level:true}));break;
  case'shopUp':run(K.act.shop(G,+id,{up:k}));break;
  case'shopAct':run(K.act.shop(G,+id,{act:k}),1);break;
  case'shopSpecial':{const [,s]=K.shopOf(G,+id);run(K.act.shop(G,+id,{special:s.special===k?null:k}),1);break}
  case'closeShop':if(confirm('Filiale wirklich schließen? Die Einrichtung wird abgeschrieben.')){run(K.act.closeShop(G,+id));close()}break;
  case'selFirm':G.cur=id;if(b.dataset.open)open('firm');else renderSheet();refresh();break;
  case'menuOn':run(K.act.menu(G,f.id,k,{on:!f.menu[k].on}),1);break;
  case'menuQ':run(K.act.menu(G,f.id,k,{q:+v}),1);break;
  case'menuPrice':run(K.act.menu(G,f.id,k,{price:f.menu[k].price+d*0.1}),1);break;
  case'research':run(K.act.research(G,f.id,k));break;
  case'hire':{const sf=view&&view.p&&view.p.id&&K.firm(G,view.p.id)||f;run(K.act.hire(G,sf.id,b.dataset.r,d),1);break}
  case'founderDev':run(K.act.founderDev(G,!G.founderDev),1);break;
  case'officeUp':run(K.act.officeUp(G,id,k));break;
  case'newGenre':{const sf=K.firm(G,view.p.id)||f;sf._g=v;renderSheet();break}
  case'newScope':{const sf=K.firm(G,view.p.id)||f;sf._s=v;renderSheet();break}
  case'newApp':{const sf=K.firm(G,id)||f;const r=run(K.act.newApp(G,sf.id,sf._g||'prod',sf._s||'S'));if(r&&r.ok)open('app',{id:r.id},true);break}
  case'appShare':{const ap=G.apps.find(x=>x.id===+id);run(K.act.app(G,+id,{share:ap.share+d}),1);break}
  case'appRelease':run(K.act.app(G,+id,{release:true}));break;
  case'appFocus':run(K.act.app(G,+id,{focus:k}),1);break;
  case'appModel':run(K.act.app(G,+id,{model:v}),1);break;
  case'appPrice':{const ap=G.apps.find(x=>x.id===+id);run(K.act.app(G,+id,{price:ap.price+d}),1);break}
  case'appCamp':run(K.act.app(G,+id,{camp:k}),1);break;
  case'appOff':if(confirm('App wirklich einstellen? Alle Nutzer gehen verloren.')){run(K.act.app(G,+id,{off:true}));close()}break;
  case'buyLine':run(K.act.buyLine(G,K.firm(G,(G.firms.find(x=>x.plants&&x.plants.some(p=>p.id===+id))||{}).id)?G.firms.find(x=>x.plants&&x.plants.some(p=>p.id===+id)).id:f.id,+id,k));break;
  case'lineW':{const [,,l]=K.lineOf(G,+id);run(K.act.line(G,+id,{workers:l.workers+d}),1);break}
  case'lineShift':run(K.act.line(G,+id,{shifts:+v}),1);break;
  case'lineGrade':run(K.act.line(G,+id,{grade:+v}),1);break;
  case'lineProd':run(K.act.line(G,+id,{product:v}),1);break;
  case'lineQC':{const [,,l]=K.lineOf(G,+id);run(K.act.line(G,+id,{qc:!l.qc}),1);break}
  case'lineMaint':{const [,,l]=K.lineOf(G,+id);run(K.act.line(G,+id,{maint:!l.maint}),1);break}
  case'lineAuto':run(K.act.line(G,+id,{auto:true}));break;
  case'sellLine':if(confirm('Linie verkaufen? Du bekommst die Hälfte des Restwerts.'))run(K.act.sellLine(G,+id));break;
  case'plantUp':run(K.act.plantUp(G,+id,k));break;
  case'accept':run(K.act.accept(G,+id));break;
  case'supplier':run(K.act.firm(G,(view.p&&view.p.id)||f.id,{supplier:v}),1);break;
  case'autoSell':{const pf=K.firm(G,id);run(K.act.firm(G,id,{autoSell:!pf.autoSell}),1);break}
  case'wholesale':run(K.act.wholesale(G,id,k));break;
  case'brand':run(K.act.brand(G,id));break;
  case'loan':run(K.act.loan(G,+v));break;case'repay':run(K.act.repay(G,+id));break;
  case'investor':run(K.act.investor(G,v==='1'));break;
  case'city':G.cityCur=id;World.setCity(G,id);refresh();renderSheet();break;
  case'unlock':run(K.act.unlockCity(G,id));break;
  case'dept':run(K.act.dept(G,k,!G.depts[k]),1);break;
  case'ipo':if(confirm('Börsengang durchführen? Du gibst 25 % neue Aktien aus.'))run(K.act.ipo(G));break;
  case'takeover':{const cp=G.comps.find(c=>c.id===+id);if(cp&&confirm(cp.name+' für '+fe(K.takeoverPrice(G,cp))+' übernehmen?'))run(K.act.takeover(G,+id));break}
  case'foundBranch':G._fb=v;renderSheet();break;
  case'found':{const n=($('foundName').value||'').trim()||({cafe:'Kaffeehaus',soft:'Appwerk',prod:'Manufaktur'}[G._fb||'cafe']);const r=run(K.act.found(G,G._fb||'cafe',n.slice(0,26)));if(r&&r.ok){G.cur=r.id;open('build')}break}
  case'decide':{const r=K.act.decide(G,+id,+v);if(r.msg)toast(r.msg,'');refresh();if(!G.pending.length){renderSheet(true)}else renderSheet(true);break}
  case'sector':view.p.sec=k;renderSheet();break;
  case'trade':run(K.act.trade(G,k,+v));break;
  case'secPct':view.p.pc=Math.max(0.01,Math.min(0.3,Math.round(((view.p.pc||0.05)+d*0.01)*100)/100));renderSheet();break;
  case'secondary':if(confirm('Neue Aktien ausgeben?'))run(K.act.secondary(G,view.p.pc||0.05));break;
  case'dividend':run(K.act.dividend(G,+v));break;
  case'salary':run(K.act.salary(G,G.me.salary+d*(G.me.salary>=200000?50000:10000)),1);break;
  case'buyLux':run(K.act.buyLux(G,k));break;case'appraise':run(K.act.appraise(G,+id));break;
  case'sellLux':if(confirm('Wirklich versteigern? Das Auktionshaus behält 8 %.'))run(K.act.sellLux(G,+id));break;
  case'buyClub':if(confirm('Verein kaufen?'))run(K.act.buyClub(G,id));break;
  case'clubBudget':run(K.act.clubBudget(G,G.me.club.budget+d*Math.max(10000,Math.round(G.me.club.value*0.0005/10000)*10000)),1);break;
  case'sellClub':if(confirm('Verein verkaufen?'))run(K.act.sellClub(G));break;
  case'buyProp':if(confirm('Gebäude kaufen?'))run(K.act.buyProp(G,id));break;
  case'sellProp':if(confirm('Gebäude verkaufen?'))run(K.act.sellProp(G,id));break;
  case'leaseR':{const pp=K.plot(G,id);run(K.act.leaseR(G,id,(pp.leaseR||1)+d*0.05),1);break}
  case'cityCamp':run(K.act.cityCamp(G,cur().id,id,k),1);break;
  case'exec':run(K.act.exec(G,k));break;
  case'endTurn':endTurn();break;
  case'closeReport':$('modal').hidden=true;if(G.over)gameOver();else if(G.pending.length)open('decide');break;
  case'save':save();toast('Gespeichert.');break;case'help':open('help',null,true);break;
  case'newGame':if(confirm('Neues Spiel beginnen? Der aktuelle Spielstand wird überschrieben.')){store.del();G=null;close();['hud','topBtns','dock','goalCard'].forEach(x=>$(x).hidden=true);showMenu()}break;
  case'restart':store.del();G=null;$('modal').hidden=true;showMenu();break;
  }});
document.addEventListener('input',e=>{const t=e.target;if(!G||!t.dataset.in)return;const f=cur();
  if(t.dataset.in==='mkt'){K.act.firm(G,f.id,{mkt:+t.value});$('mktV').textContent=fe(f.mkt)+' / Monat'}
  if(t.dataset.in==='wage'){K.act.firm(G,f.id,{wage:+t.value});$('wageV').textContent=pct(f.wage)}
  if(t.dataset.in==='ads'){K.act.app(G,+t.dataset.id,{ads:+t.value});$('adsV').textContent=fe(G.apps.find(a=>a.id===+t.dataset.id).ads)+' / Monat'}
  if(t.dataset.in==='brand'){K.act.firm(G,t.dataset.id,{brandMkt:+t.value});$('brandV').textContent=fe(K.firm(G,t.dataset.id).brand.mkt)+' / Monat'}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.in)refresh()});
let toastT=0;function toast(t,k){const el=$('toast');el.textContent=t;el.className='toast panel '+(k||'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden&&G&&!G.over){$('modal').hidden=true}else if(place)endPlace();else close()}});

// ---------- Stadt ----------
const cv=$('gl');const pts=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)drag={x:e.clientX,y:e.clientY,yaw:World.view.yaw,tilt:World.view.tilt,moved:false};
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:World.view.zoom};drag=null}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)){World.hover(World.plotAt(e.clientX,e.clientY));return}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];World.view.zoom=pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;World.applyView();return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(drag.moved){World.view.yaw=drag.yaw-dx*0.006;World.view.tilt=drag.tilt-dy*0.004;World.applyView()}}});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(drag&&!drag.moved&&G)tapPlot(World.plotAt(e.clientX,e.clientY));drag=null});
cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();World.view.zoom*=Math.exp(-e.deltaY*0.0012);World.applyView()},{passive:false});
addEventListener('resize',()=>{mobile=matchMedia('(max-width:760px)').matches;World.resize()});
function tapPlot(pid){if(!pid){if(!place)close();return}const p=K.plot(G,pid);World.select(pid);
  if(place){if(!eligible(place.kind).includes(pid)){toast('Hier geht das nicht. Wähle ein grün markiertes Grundstück.','bad');return}open('plot',{id:pid});return}
  if(p.owner==='H'){open('group',{tab:'hq'});return}
  if(p.owner&&!p.owner.startsWith('c:')){const f=K.firm(G,p.owner);G.cur=f.id;refresh();
    if(p.use==='cafe'){const s=f.shops.find(x=>x.plot===pid);open('shop',{id:s.id})}else if(p.use==='factory'){const pl=f.plants.find(x=>x.plot===pid);open('plant',{id:pl.id})}else if(p.use==='office')open('office',{id:f.id});return}
  open('plot',{id:pid})}
function tags(){const el=$('tags');if(!G){el.innerHTML='';return}const out=[];
  for(const p of G.plots){if(p.city!==World.city||!p.owner||p.owner.startsWith('c:'))continue;const pr=World.project(p.id,p.use==='hq'?19:p.use==='office'?9:7);if(!pr||!pr.vis)continue;
    let t='',col='#24272b';if(p.owner==='H')t='Zentrale';else{const f=K.firm(G,p.owner);if(!f)continue;col=f.color;
      if(p.use==='cafe'){const s=f.shops.find(x=>x.plot===p.id);t=s&&s.stat?fn(s.stat.guests)+' Gäste':'neu'}
      if(p.use==='office')t=fn(G.apps.filter(a=>a.owner===f.id&&a.state==='live').reduce((s,a)=>s+a.users,0))+' Nutzer';
      if(p.use==='factory'){const pl=f.plants.find(x=>x.plot===p.id);t=pl&&pl.lines.length?pl.lines.length+(pl.lines.length>1?' Linien':' Linie'):'leer'}}
    out.push(`<div class="tag" style="left:${pr.x}px;top:${pr.y}px"><i style="background:${col}"></i>${esc(t)}</div>`)}
  el.innerHTML=out.join('')}
let lastTag=0;function loop(t){if(G&&t-lastTag>120){tags();lastTag=t}World.frame(t);requestAnimationFrame(loop)}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);

if(typeof World==='undefined')window.World={view:{yaw:0,tilt:1,zoom:1},applyView(){},city:null};
let glOk=true;try{World.init(cv)}catch(e){glOk=false;console.error(e)}
if(!glOk){Object.assign(World,{frame(){},sync(){},setCity(){},plotAt:()=>null,project:()=>null,select(){},hover(){},resize(){},applyView(){},highlight(){}});Object.defineProperty(World,'city',{get:()=>G&&G.cityCur,configurable:true})}
const saved=store.get();if(saved&&saved.v===2){G=saved;afterLoad();if(G.over)gameOver()}else showMenu();
requestAnimationFrame(loop);
window.__G=()=>G;
})();
</script>
